<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="hevi-action-title hevi-action-desc">
<title id="hevi-action-title">Enabled steps run in a fixed order</title><desc id="hevi-action-desc">The action loads charts from directory, then runs enabled versionize, package, release and push operations in that order. All four flags default to false; enabling release or push does not enable package.</desc>
<style>:root{--panel:#f7f8fc;--card:#ffffff;--text:#20283d;--muted:#526078;--line:#268bc5;--accent:#268bc5}@media(prefers-color-scheme:dark){:root{--panel:#121a28;--card:#1d293c;--text:#edf3ff;--muted:#bccade;--line:#7ec8f2;--accent:#7ec8f2}}text{font-family:Arial,sans-serif;fill:var(--text)}.label{font-size:17px;fill:var(--muted)}.heading{font-size:22px;font-weight:700}.code{font-family:monospace;font-size:18px}.card{fill:var(--card);stroke:var(--line);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#hevi-action-arrow)}</style>
<defs><marker id="hevi-action-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--line)"/></marker></defs>
<rect x="2" y="2" width="956" height="356" rx="20" fill="var(--panel)"/>
<text x="30" y="42" class="heading">Opt in to each chart operation</text>
<rect x="30" y="68" width="900" height="58" rx="12" class="card"/><text x="50" y="104" class="code">loadMany(directory) · directory defaults to charts</text>
<path d="M480 126V145H127V160" class="arrow"/>
<rect x="30" y="165" width="195" height="90" rx="12" class="card"/><text x="48" y="199" class="heading">1 · versionize</text><text x="48" y="230" class="label">Chart.yaml versions</text>
<rect x="265" y="165" width="195" height="90" rx="12" class="card"/><text x="283" y="199" class="heading">2 · package</text><text x="283" y="230" class="label">Helm packages</text>
<rect x="500" y="165" width="195" height="90" rx="12" class="card"/><text x="518" y="199" class="heading">3 · release</text><text x="518" y="230" class="label">GitHub + index</text>
<rect x="735" y="165" width="195" height="90" rx="12" class="card"/><text x="753" y="199" class="heading">4 · push</text><text x="753" y="230" class="label">OCI registry</text>
<path d="M225 210H260" class="arrow"/><path d="M460 210H495" class="arrow"/><path d="M695 210H730" class="arrow"/>
<rect x="30" y="280" width="900" height="53" rx="12" class="card"/><text x="50" y="313" class="label">Each flag defaults to false. Release and push need packages; enable package explicitly.</text>
</svg>